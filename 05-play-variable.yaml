- name: play level variables 
  hosts: local
  connection: local
  vars: 
   COURSE: ansible
   DURATION: 10hrs
   TRAINER: siva 

  tasks: 
   - name: print the course information 
     ansible.builtin.debug: 
      msg: "hello {{ COURSE }}, duration: {{ DURATION }}, trainer is {{ TRAINER }}"

   - name: print the course information again
     ansible.builtin.debug: 
      msg: "hello {{ COURSE }}, duration: {{ DURATION }}, trainer is {{ TRAINER }}"