- name: task level variables 
  hosts: local
  connection: local
  vars: 
   COURSE: ansible
   DURATION: 10hrs
   TRAINER: siva 

  tasks: 
   - name: print the course information 
     vars: 
      COURSE: devops 
      ansible.builtin.debug: 
      msg: "Hello {{ COURSE }}, Course duration: {{ DURATION }}, trainer is {{ TRAINER }}"

  