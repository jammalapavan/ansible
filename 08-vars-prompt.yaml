- name : variable from prompt 
  hosts: local
  connection: local
  vars_prompt: 
  - name: username 
    prompt: please enter your username 
    private: false
  
  - name: password 
    prompt: please enter your password
    private: false

  tasks: 
  - name: printing the user information 
    ansible.builtin.debug:
     msg: "Hello username is : {{ username }}, password is : {{ password }}"  
